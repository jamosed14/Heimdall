name: Market Fast refresh (Yahoo DXY/futures + FRED, hourly weekdays)

# Target: 9:35, 10:35, 11:35, 12:35, 13:35, 14:35, 15:35 ET (every hour on :35) plus a 4:10 PM ET
# close pass, weekdays only. Runs fetch_macro_data.ps1 only - equities was split out to its own
# refresh-equities-fast.yml on 2026-08-20 so it could run on a faster (15-min, pre/post-market
# inclusive) cadence than this FRED-bundled schedule without dragging pointless extra FRED hits
# along with it (FRED's series here are single-daily-print - see note below).
#
# IMPORTANT: only part of this script's own payload is genuinely intraday. Its Yahoo-sourced
# pieces (DXY, ZQ Fed Funds futures for the implied policy path) are live market quotes and
# really do refresh each run. Its FRED-sourced pieces (Treasury yields, Fed balance sheet,
# CPI/PCE, M2, dot plot, EFFR/DFF, SOFR) are confirmed single-daily-print series - verified
# directly against FRED's own series metadata before this schedule was built (DGS10:
# frequency=Daily; DFF: frequency="Daily, 7-Day"; SOFR: frequency=Daily; ICE BofA OAS series:
# frequency="Daily, Close"). Running this hourly doesn't make those series more real-time; it
# just means the merge-by-date fail-stale logic correctly no-ops on them between the once-daily
# FRED publish, exactly as it would on any cadence. Don't describe DFF/SOFR themselves as "live"
# just because ZQ futures (expected future policy) riding along in the same script are - a daily
# fixing and a live futures quote are different animals even when they cover the same rate.
#
# GitHub Actions cron is fixed UTC with no DST awareness. This fires every hour on the UTC :35
# mark (covering all 7 EDT/EST variants of the 9:35-3:35 ET passes with one cron line) plus two
# explicit UTC times for the 4:10 PM ET close pass (EDT/EST variants), and the runtime gate
# below uses .NET's DST-aware TimeZoneInfo to decide whether the current moment is actually
# within a real target window before doing anything - exact year-round, not an approximation.

on:
  schedule:
    - cron: "35 * * * *"    # every hour at :35 UTC - covers all DST variants of 9:35-15:35 ET
    - cron: "10 20 * * *"   # 4:10 PM ET close pass during EDT (UTC-4)
    - cron: "10 21 * * *"   # 4:10 PM ET close pass during EST (UTC-5)
  workflow_dispatch: {}

# Own concurrency group, not shared with the other refresh workflows - see commit-push-retry's
# doc comment for why that's safe (each workflow only ever writes its own distinct data/*.js
# files, so a push race is only ever a timing conflict, never a real content conflict). A shared
# group was tried first and rejected: GitHub Actions concurrency groups only hold one pending run
# at a time, so with four workflows queuing into one group, a newly-queued run evicts whichever
# run was already waiting - confirmed in production as the reason the BTC Fast (GEX) workflow's
# hourly cron was actually landing every ~2 hours instead of hourly.
concurrency:
  group: heimdall-market-fast
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check scheduled pass
        id: gate
        if: github.event_name == 'schedule'
        shell: pwsh
        run: |
          try {
            $etTz = [System.TimeZoneInfo]::FindSystemTimeZoneById("America/New_York")
          } catch {
            $etTz = [System.TimeZoneInfo]::FindSystemTimeZoneById("Eastern Standard Time")
          }
          $etNow = [System.TimeZoneInfo]::ConvertTimeFromUtc((Get-Date).ToUniversalTime(), $etTz)
          $isWeekday = $etNow.DayOfWeek -ne [System.DayOfWeek]::Saturday -and $etNow.DayOfWeek -ne [System.DayOfWeek]::Sunday

          # GitHub Actions scheduled (cron) triggers are documented to be delayed - sometimes by
          # 10-20+ minutes, especially for a workflow that was just created/edited - so a tight
          # +-5min tolerance around each checkpoint was rejecting legitimate runs outright
          # (confirmed in production: two consecutive real firings both landed outside a +-5min
          # window and got skipped). Checked against each of the 8 explicit target checkpoints
          # individually with a +-20min tolerance, rather than one broad per-hour range - a broad
          # range was tried first and rejected because it let the *other* DST variant's close-
          # pass cron entry (e.g. the EDT-targeted 20:10 UTC firing landing at 3:10pm ET during
          # EST) bleed into the hourly window. Checkpoints are spaced >=25min apart at their
          # closest, so a +-20min tolerance per checkpoint can never double-match two neighbors.
          $checkpoints = @(
            @{ H = 9;  M = 35 }, @{ H = 10; M = 35 }, @{ H = 11; M = 35 }, @{ H = 12; M = 35 },
            @{ H = 13; M = 35 }, @{ H = 14; M = 35 }, @{ H = 15; M = 35 }, @{ H = 16; M = 10 }
          )
          $nowMinutes = $etNow.Hour * 60 + $etNow.Minute
          $nearCheckpoint = $false
          foreach ($cp in $checkpoints) {
            $cpMinutes = $cp.H * 60 + $cp.M
            if ([math]::Abs($nowMinutes - $cpMinutes) -le 20) { $nearCheckpoint = $true; break }
          }
          $shouldRun = $isWeekday -and $nearCheckpoint
          Write-Host ("ET now: {0} ({1}) - near a checkpoint: {2}, weekday: {3} -> shouldRun: {4}" -f `
            $etNow.ToString("yyyy-MM-dd HH:mm"), $etNow.DayOfWeek, $nearCheckpoint, $isWeekday, $shouldRun)
          # Out-File's default encoding on pwsh/Linux has known quirks that can silently corrupt
          # GITHUB_OUTPUT's expected plain-UTF8 KEY=VALUE format (a documented, common gotcha,
          # not hypothetical - this is the actual root cause found after this gate showed a
          # 100% pass-through failure rate across 4 days and 3 separate gate-logic rewrites,
          # despite the window math itself testing correctly every time in isolation).
          # Add-Content with explicit -Encoding utf8 is the reliable pattern.
          Add-Content -Path $env:GITHUB_OUTPUT -Value "shouldRun=$($shouldRun.ToString().ToLower())" -Encoding utf8

      - name: Run fetch_macro_data.ps1
        id: fetch
        if: github.event_name != 'schedule' || steps.gate.outputs.shouldRun == 'true'
        shell: pwsh
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: ./fetch_macro_data.ps1

      - uses: ./.github/actions/commit-push-retry
        if: always()
