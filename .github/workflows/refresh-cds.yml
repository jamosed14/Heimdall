name: CDS refresh (ICE Clear Credit settlement prices - once daily, next-morning ET)

# 2026-08-27 note: every scheduled workflow in this repo went silent simultaneously around
# 2026-08-26 16:36-16:37 UTC despite healthy, unrelated cron schedules - manual workflow_dispatch
# ran fine (confirmed via GitHub UI), so this was a stuck schedule trigger, not an account block
# or a workflow bug. This edit exists to re-arm the schedule (a push to the workflow file is a
# known, if undocumented, fix for a stalled GitHub Actions cron).

# Split out from Slow refresh on 2026-08-24 after the AI tab's CDS History chart stopped
# accumulating new points past 2026-08-21. Root cause: ICE Clear Credit's public settlement-price
# API (https://www.ice.com/api/cds-settlement-prices/icc-single-names) publishes per-name on a
# rolling basis, not as one atomic daily snapshot - confirmed live by checking which names had
# already rolled to the new clearingDate at a given moment.
#
# First fix attempt (22:00 UTC / 6pm ET, same-day) was WRONG - corrected 2026-08-25 with better
# evidence. Timeline that pinned it down:
#   - Mon 2026-08-24, 10:30am ET: our 6 US names still on Fri 08-21's print; APAC/AU names
#     (Alibaba, ANZ, Bank of China) had already rolled to Monday's - suggested US names just
#     settle later in the day.
#   - Mon 2026-08-24, 6:57pm ET (the since-corrected 22:00 UTC run): still Fri 08-21 for our
#     names - so "later the same day" was wrong too.
#   - Tue 2026-08-25, 8:57am ET: Monday's (08-24) print was finally there for all six names.
# So the real pattern is T+1 morning, not same-day evening - ICE's overnight settlement/collation
# batch for a given trading day isn't ready until the following morning.
#
# 13:00 UTC = 9am ET (EDT) / 8am EST - comfortable buffer past a plausible overnight-batch
# completion time, still a best-effort guess (ICE publishes no schedule for this free endpoint).
# One day always lags one day behind by nature of this pattern (Tuesday's fetch gets Monday's
# print) - that's expected, not a bug, given the source's own publish timing.
#
# No DST-aware gating needed (unlike the two hourly workflows): a once-daily job just needs to
# land sometime in the right general window, not wall-clock ET precision to the minute.

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

# Own concurrency group - see commit-push-retry's doc comment and refresh-btc-fast.yml's comment
# for why a shared group across refresh workflows was rejected.
concurrency:
  group: heimdall-cds
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run fetch_cds_data.ps1
        shell: pwsh
        run: ./fetch_cds_data.ps1

      - uses: ./.github/actions/commit-push-retry
