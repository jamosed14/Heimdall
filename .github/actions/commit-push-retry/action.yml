name: "Commit and push data changes with retry"
description: >
  Commits any changed data/*.js files and pushes to main, retrying after a pull --rebase if the
  push is rejected. Shared by all four refresh cadence workflows (BTC Fast, Market Fast, Equities
  Fast, Slow) so this logic exists once, not four times. Each workflow now has its own
  `concurrency` group (split 2026-08-20 - a shared group across all of them was tried first and
  rejected once it was confirmed to be silently dropping scheduled runs: GitHub Actions
  concurrency groups only hold one pending run at a time, so multiple workflows queuing into one
  group evict each other's waiting runs under contention). This retry is now the primary
  safeguard against a real push race (two workflows finishing at the same moment, a
  workflow_dispatch overlapping a scheduled run), not just defense-in-depth. Since each cadence
  class only ever writes its own distinct data/*.js files, a rebase here can never hit a real
  content conflict - only ever a timing one - so retrying is always safe.
runs:
  using: "composite"
  steps:
    - shell: bash
      run: |
        git config user.name "heimdall-refresh-bot"
        git config user.email "actions@github.com"
        git add data/*.js
        if git diff --cached --quiet; then
          echo "No data changes - skipping commit."
          exit 0
        fi
        git commit -m "Data refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
        for i in 1 2 3; do
          if git push; then
            echo "Pushed successfully."
            exit 0
          fi
          echo "Push rejected (attempt $i/3) - pulling/rebasing and retrying..."
          git pull --rebase origin main
        done
        echo "::error::Failed to push after 3 attempts."
        exit 1
